## use ws2812-spi
CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_WS2812=y
CONFIG_RGBLED_WIDGET_LED_COUNT=2

CONFIG_RGBLED_WIDGET_BRIGHTNESS=64

# Keep each physical indicator dedicated to the status shown by the original
# Cornix firmware. The left half reverses the two roles because its left LED
# is the Bluetooth indicator; the right-half mapping is set in its board
# defconfig.
CONFIG_RGBLED_WIDGET_CONN_SHOW_USB=n
CONFIG_RGBLED_WIDGET_SHOW_CAPSLOCK=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=n
CONFIG_RGBLED_WIDGET_LED_SHARING=n

# The original split indicator uses blue for the right-hand connection state.
# BT profile colors remain green, red, and blue for channels 0, 1, and 2.
CONFIG_RGBLED_WIDGET_CONN_COLOR_CONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=4
CONFIG_RGBLED_WIDGET_CONN_ADV_DURATION_MS=0
CONFIG_RGBLED_WIDGET_CONN_CONNECTED_DURATION_MS=1500
CONFIG_RGBLED_WIDGET_CONN_DISCONNECTED_DURATION_MS=0
